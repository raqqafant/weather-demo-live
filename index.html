<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomorrow's Weather – Hamar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a2a4a 0%, #2d5986 60%, #4a90c4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 1rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .location {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.7;
      margin-bottom: 0.25rem;
    }

    .date {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }

    .summary {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .weather-icon {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    .temp-main {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
    }

    .temp-main span {
      font-size: 1.5rem;
      font-weight: 400;
      opacity: 0.7;
    }

    .condition {
      font-size: 1rem;
      opacity: 0.85;
      margin-top: 0.2rem;
      text-transform: capitalize;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    .stat {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.75rem 1rem;
    }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.6;
      margin-bottom: 0.2rem;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .hourly {
      margin-top: 1.75rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .hourly-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.6;
      margin-bottom: 0.75rem;
    }

    .hourly-row {
      display: flex;
      gap: 0.6rem;
    }

    .hour-block {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.5rem 0.65rem;
      text-align: center;
      flex: 0 0 auto;
      min-width: 58px;
    }

    .hour-time {
      font-size: 0.72rem;
      opacity: 0.65;
      margin-bottom: 0.3rem;
    }

    .hour-icon {
      width: 28px;
      height: 28px;
      margin: 0 auto 0.3rem;
    }

    .hour-temp {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .error, .loading {
      text-align: center;
      padding: 2rem 0;
      opacity: 0.8;
      font-size: 1rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .source {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      opacity: 0.45;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="loading">
      <div class="spinner"></div>
      Fetching forecast…
    </div>
  </div>

  <script>
    const LAT = 60.7945;
    const LON = 11.0680;
    const LOCATION = "Hamar, Norway";

    // MET Norway symbol-code → emoji (subset)
    const SYMBOL_EMOJI = {
      clearsky:        "☀️",
      fair:            "🌤️",
      partlycloudy:    "⛅",
      cloudy:          "☁️",
      fog:             "🌫️",
      lightrain:       "🌦️",
      rain:            "🌧️",
      heavyrain:       "🌧️",
      rainshowers:     "🌦️",
      heavyrainshowers:"🌧️",
      sleet:           "🌨️",
      lightsleet:      "🌨️",
      snow:            "❄️",
      lightsnow:       "🌨️",
      heavysnow:       "❄️",
      snowshowers:     "🌨️",
      thunder:         "⛈️",
      lightsnowandthunder: "⛈️",
    };

    function symbolToEmoji(code) {
      if (!code) return "🌡️";
      const base = code.replace(/_day$|_night$|_polartwilight$/, "").toLowerCase();
      for (const [key, emoji] of Object.entries(SYMBOL_EMOJI)) {
        if (base.includes(key)) return emoji;
      }
      return "🌡️";
    }

    function symbolToLabel(code) {
      if (!code) return "—";
      return code
        .replace(/_day$|_night$|_polartwilight$/, "")
        .replace(/_/g, " ");
    }

    function iconUrl(code) {
      if (!code) return null;
      return `https://api.met.no/images/weathericons/svg/${code}.svg`;
    }

    function tomorrow() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return d.toISOString().slice(0, 10); // YYYY-MM-DD
    }

    function formatDate(isoDate) {
      const d = new Date(isoDate + "T12:00:00");
      return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }

    async function fetchForecast() {
      const url = `https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${LAT}&lon=${LON}`;
      const res = await fetch(url, {
        headers: { "User-Agent": "weather-demo-hamar/1.0 toreinar.skarderud@gmail.com" }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function processData(data) {
      const tomorrowDate = tomorrow();
      const timeseries = data.properties.timeseries;

      // Filter entries for tomorrow
      const tomorrowEntries = timeseries.filter(t =>
        t.time.startsWith(tomorrowDate)
      );

      if (!tomorrowEntries.length) throw new Error("No forecast data for tomorrow.");

      // Pick midday (12:00) as the "headline" reading
      const midday = tomorrowEntries.find(t => t.time.includes("T12:00:00Z"))
        || tomorrowEntries[Math.floor(tomorrowEntries.length / 2)];

      const inst = midday.data.instant.details;
      const next6 = midday.data.next_6_hours || midday.data.next_12_hours || {};
      const symbol = next6.summary?.symbol_code
        || tomorrowEntries[0].data.next_6_hours?.summary?.symbol_code
        || null;

      // Min/max temperature across the day
      const temps = tomorrowEntries.map(t => t.data.instant.details.air_temperature);
      const tempMin = Math.round(Math.min(...temps));
      const tempMax = Math.round(Math.max(...temps));

      // Total precipitation for the day (sum of next_1_hours or next_6_hours)
      let totalPrecip = 0;
      for (const entry of tomorrowEntries) {
        const p = entry.data.next_1_hours?.details?.precipitation_amount
          ?? entry.data.next_6_hours?.details?.precipitation_amount
          ?? 0;
        totalPrecip += p;
      }

      // Hourly slots: every 3 hours
      const hourlySlots = tomorrowEntries.filter((_, i) => i % 3 === 0).slice(0, 8);

      return {
        date: tomorrowDate,
        symbol,
        tempNow: Math.round(inst.air_temperature),
        tempMin,
        tempMax,
        windSpeed: Math.round(inst.wind_speed * 10) / 10,
        humidity: Math.round(inst.relative_humidity),
        precipitation: Math.round(totalPrecip * 10) / 10,
        cloudCover: Math.round(inst.cloud_area_fraction),
        hourly: hourlySlots.map(entry => ({
          time: new Date(entry.time).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Oslo" }),
          temp: Math.round(entry.data.instant.details.air_temperature),
          symbol: entry.data.next_1_hours?.summary?.symbol_code
            || entry.data.next_6_hours?.summary?.symbol_code
            || null,
        })),
      };
    }

    function render(f) {
      const icon = iconUrl(f.symbol);
      const iconHtml = icon
        ? `<img class="weather-icon" src="${icon}" alt="${f.symbol}" onerror="this.replaceWith(document.createTextNode('${symbolToEmoji(f.symbol)}'))">`
        : `<span style="font-size:3rem">${symbolToEmoji(f.symbol)}</span>`;

      const hourlyHtml = f.hourly.map(h => {
        const hIcon = iconUrl(h.symbol);
        const hIconHtml = hIcon
          ? `<img class="hour-icon" src="${hIcon}" alt="" onerror="this.replaceWith(document.createTextNode('${symbolToEmoji(h.symbol)}'))">`
          : `<div style="font-size:1.4rem;line-height:28px">${symbolToEmoji(h.symbol)}</div>`;
        return `
          <div class="hour-block">
            <div class="hour-time">${h.time}</div>
            ${hIconHtml}
            <div class="hour-temp">${h.temp}°</div>
          </div>`;
      }).join("");

      document.getElementById("app").innerHTML = `
        <div class="location">${LOCATION}</div>
        <div class="date">${formatDate(f.date)}</div>

        <div class="summary">
          ${iconHtml}
          <div>
            <div class="temp-main">${f.tempMax}°<span>C</span></div>
            <div class="condition">${symbolToLabel(f.symbol)}</div>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">High / Low</div>
            <div class="stat-value">${f.tempMax}° / ${f.tempMin}°</div>
          </div>
          <div class="stat">
            <div class="stat-label">Wind</div>
            <div class="stat-value">${f.windSpeed} m/s</div>
          </div>
          <div class="stat">
            <div class="stat-label">Precipitation</div>
            <div class="stat-value">${f.precipitation} mm</div>
          </div>
          <div class="stat">
            <div class="stat-label">Humidity</div>
            <div class="stat-value">${f.humidity}%</div>
          </div>
        </div>

        <div class="hourly">
          <div class="hourly-title">Hourly – every 3 h</div>
          <div class="hourly-row">${hourlyHtml}</div>
        </div>

        <div class="source">Data: MET Norway / Meteorologisk institutt</div>
      `;
    }

    function renderError(msg) {
      document.getElementById("app").innerHTML = `
        <div class="error">
          <div style="font-size:2rem;margin-bottom:0.5rem">⚠️</div>
          <div>${msg}</div>
        </div>`;
    }

    (async () => {
      try {
        const data = await fetchForecast();
        const forecast = processData(data);
        render(forecast);
      } catch (err) {
        renderError(err.message || "Could not load forecast.");
        console.error(err);
      }
    })();
  </script>
</body>
</html>
